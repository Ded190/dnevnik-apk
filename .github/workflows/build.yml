name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-bump version
        run: |
          VER=$(grep -m1 '^version *=' buildozer.spec | sed 's/.*= *//' | tr -d ' \r')
          MA=$(echo "$VER" | cut -d. -f1)
          MI=$(echo "$VER" | cut -d. -f2)
          PA=$(echo "$VER" | cut -d. -f3)
          PA=${PA:-0}
          PA=$((PA+1))
          NEW="$MA.$MI.$PA"
          sed -i "s/^version *=.*/version = $NEW/" buildozer.spec
          sed -i -E "s/APP_VERSION = \"[0-9.]+ $([^\"]*)$\"/APP_VERSION = \"$NEW (\1)\"/" main.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add buildozer.spec main.py
          git commit -m "Автоподъём версии до $NEW [skip ci]" || echo "нет изменений для коммита"
          git push origin HEAD:main || echo "push не удался (не критично)"
          echo "Новая версия: $NEW"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libffi-dev libssl-dev ccache

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36 buildozer

      - name: Remember signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: dnevnik-apk-signing-v1

      - name: Build APK
        run: |
          echo "pip<26" > /tmp/pip-constraint.txt
          export PIP_CONSTRAINT=/tmp/pip-constraint.txt
          yes | buildozer -v android debug > build.log 2>&1

      - name: Show last error lines
        if: failure()
        run: |
          echo "===== ПОСЛЕДНИЕ 400 СТРОК ЛОГА СБОРКИ ====="
          tail -n 400 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnevnik-apk
          path: bin/*.apk
